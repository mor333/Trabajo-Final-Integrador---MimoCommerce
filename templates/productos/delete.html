{% extends 'base/base.html' %}
{% block title %}Eliminar producto | MimoCommerce{% endblock %}
{% block contentido %}
    <h1>Confirmar Eliminación</h1>
    <p>¿Estás seguro de que deseas eliminar el producto <strong>"{{ object.nombre }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button-danger" type="submit">Sí, eliminar</button>
            <a class="button button-secondary" href="{% url 'productos:producto_list' %}">Cancelar</a>
        </div>
    </form>
{% endblock contentido %}
